# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy To Ec2

on:
  push:
    branches:
      - react

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Guthub Repo에 올린 파일을 불러오기
        uses: actions/checkout@v4
        
      - name: 🔍 디렉토리 구조 확인용 (디버깅용 Step)!
        run: |
          echo ":: 디렉토리 구조 ::"
          ls -al
          echo ":: distribution 디렉토리 안 ::"
          ls -al distribution || true
          echo ":: my_app 디렉토리 안 ::"
          ls -al my_app || true
          echo ":: distribution/my_app 디렉토리 안 ::"
          ls -al distribution/my_app || true

      - name: JDK 17번전 설치
        uses: actions/setup-java@v4
        with:
           distribution: temurin
           java-version: 17

      - name: application.yml
        run: |
         mkdir -p src/main/resources
         echo "${{secrets.APPLICATION_PROPERTIES}}" > ./src/main/resources/application.yml

      - name: 테스트 및 빌드
        run: ./gradlew clean build -x test

      - name: 빌드된 파일 이름변경
        run: mv ./build/libs/*SNAPSHOT.jar ./project.jar
        
      - name: 실행권한 부여
        run: chmod +x scripts/*.sh

      - name: scripts 폴더 내용 확인
        run: ls -l scripts/

      - name: 압축하기
        run: tar -czvf $GITHUB_SHA.tar.gz project.jar appspec.yml scripts

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
           aws-region: ap-northeast-2
           aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Docker 이미지 생성
        run: docker build -t distribution .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag distribution ${{ steps.login-ecr.outputs.registry }}/distribution:latest

      - name: ECR에 Docker 이미지 Push하기
        run: docker push ${{ steps.login-ecr.outputs.registry }}/distribution:latest

      - name: S3에 프로젝트 폴더 업로드하기
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.tar.gz s3://distribution4/$GITHUB_SHA.tar.gz

      - name: Code Deploy를 활용해 EC2에 프로젝트 코드 배포
        run: |
             aws deploy create-deployment \
             --application-name distribution \
             --deployment-config-name CodeDeployDefault.AllAtOnce \
             --deployment-group-name Production \
             --s3-location bucket=distribution4,bundleType=tgz,key=$GITHUB_SHA.tar.gz

      # ---️ 프론트엔드 빌드 단계 추가 ---
      - name: Node 설치 (프론트 빌드용)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 프론트엔드 의존성 설치
        run: npm install
        working-directory: ./my_app

      - name: 프론트엔드 빌드
        run: npm run build
        working-directory: ./my_app

      # 웹 정적 리소스 업로드용
      - name: AWS Credentials 설정 (Web 정적 파일용)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 
      - name: S3 버킷 리스트 확인 (접근 권한 테스트)
        run: aws s3 ls s3://distribution4

      # S3 정적 파일 업로드
      - name: 정적 파일 재배포
        run: |
          aws s3 rm --recursive s3://distribution4
          aws s3 cp ./my_app/build s3://distribution4/ --recursive

      # CloudFront 캐시 무효화
      - name: CloudFront 캐시 무효화
        run: |
         aws cloudfront create-invalidation \
         --distribution-id ${{secrets.CLOUD_FRONT_DISTRIBUTION_ID}} \
         --paths "/*"
